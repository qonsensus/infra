name: quonsensus

services:
  postgres:
    container_name: qonsensus-postgres
    image: postgres
    profiles:
      - dev
      - backend_only
      - full
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./volumes/postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
  backend:
    container_name: qonsensus-backend
    image: ghcr.io/qonsensus/backend:latest
    profiles:
      - backend_only
      - full
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:?}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      DB_NAME: ${POSTGRES_DB:?}
      ANNOUNCED_DOMAIN: ${BACKEND_ANNOUNCED_HOST:?}
      TURN_HOST: ${COTURN_DOMAIN:?}
      TURN_PORT: 3478
      TURN_SECRET: ${TURN_SECRET:?}
      CORS_ALLOWED_ORIGINS: "${FRONTEND_ANNOUNCED_SCHEMA:?}://${FRONTEND_ANNOUNCED_HOST:?}"
    ports:
      - ${MEDIASOUP_UDP_MIN:?}-${MEDIASOUP_UDP_MAX:?}:${MEDIASOUP_UDP_MIN:?}-${MEDIASOUP_UDP_MAX:?}/udp
      - ${BACKEND_PORT:?}:3000/tcp
      - ${BACKEND_PORT:?}:3000/udp
  frontend:
    container_name: qonsensus-frontend
    image: ghcr.io/qonsensus/frontend:latest
    profiles:
      - full
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_URL: ${BACKEND_ANNOUNCED_SCHEMA:-https}://${BACKEND_ANNOUNCED_HOST:?}
    ports:
      - ${WEBAPP_PORT}:80
  coturn:
    container_name: qonsensus-coturn
    image: coturn/coturn:latest
    profiles:
      - backend_only
      - full
    network_mode: host
    volumes:
      - ./volumes/coturn-data:/var/lib/coturn
      - ./config/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./entrypoints/coturn-entry.sh:/entrypoint.sh:ro
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
