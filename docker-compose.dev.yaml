name: qonsensus-dev

services:
  postgres:
    image: postgres
    container_name: qonsensus-dev-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-qonsensus}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # Uncomment the following lines to persist PostgreSQL data on the host machine
    # volumes:
    #   - ./data/postgres-data:/var/lib/postgresql
